<?xml version="1.0" encoding="UTF-8"?>
<!-- BRIEF: Agent Registry UI zero-backend architecture. AWS-style boxed diagram,
     1240x760 landscape. Left: CloudFront + private S3 (OAC) delivering the static
     Cloudscape SPA. Centre: the browser running the SPA. Right: the four AWS
     surfaces it talks to directly - Cognito User Pool (1 password auth), Cognito
     Identity Pool (2 token -> persona-scoped IAM creds), the Agent Registry
     control plane (3 SigV4, always IAM) and the registry's MCP endpoint
     (4 bearer JWT, CUSTOM_JWT authorizer). Palette: AWS squid-ink #232F3E, orange
     #FF9900, networking purple #8C4FFF, storage green #7AA116, security red
     #DD344C, ML teal #01A88D. Emphasis: there is no application server, AWS is the
     real authorization gate, and registry administration is out of scope. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#232F3E"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A94A6"/>
    </marker>
    <linearGradient id="spaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F6FA"/>
    </linearGradient>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <text x="40" y="52" font-size="27" font-weight="bold" fill="#232F3E">Agent Registry UI — zero-backend architecture</text>
    <text x="40" y="78" font-size="15" fill="#5A6675">A static SPA authenticates with Cognito, uses persona-scoped IAM credentials for the control plane, and its Cognito token as a bearer credential for discovery.</text>
  </g>

  <!-- ================= hosting (CloudFront + S3) ================= -->
  <g id="hosting">
    <rect x="40" y="120" width="270" height="250" rx="10" fill="#FAFBFC" stroke="#C6CDD6" stroke-dasharray="6 4"/>
    <text x="56" y="145" font-size="12" font-weight="bold" fill="#8A94A6" letter-spacing="1">STATIC HOSTING</text>

    <g id="cloudfront">
      <rect x="60" y="162" width="230" height="76" rx="8" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="2"/>
      <rect x="60" y="162" width="230" height="26" rx="8" fill="#8C4FFF"/>
      <text x="175" y="180" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Amazon CloudFront</text>
      <text x="175" y="207" font-size="12" fill="#232F3E" text-anchor="middle">HTTPS + SPA error routing</text>
      <text x="175" y="225" font-size="11" fill="#5A6675" text-anchor="middle">403/404 → /index.html (200)</text>
    </g>

    <g id="s3">
      <rect x="60" y="268" width="230" height="76" rx="8" fill="#FFFFFF" stroke="#7AA116" stroke-width="2"/>
      <rect x="60" y="268" width="230" height="26" rx="8" fill="#7AA116"/>
      <text x="175" y="286" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Amazon S3 (private)</text>
      <text x="175" y="313" font-size="12" fill="#232F3E" text-anchor="middle">built SPA bundle</text>
      <text x="175" y="331" font-size="11" fill="#5A6675" text-anchor="middle">read only via OAC</text>
    </g>

    <line id="cf-to-s3" x1="175" y1="268" x2="175" y2="240" stroke="#8A94A6" stroke-width="1.6" marker-end="url(#arrowLight)"/>
    <text x="185" y="258" font-size="10" fill="#8A94A6">origin (OAC)</text>
  </g>

  <!-- ================= browser / SPA ================= -->
  <g id="browser">
    <rect x="378" y="120" width="300" height="430" rx="10" fill="url(#spaFill)" stroke="#232F3E" stroke-width="2"/>
    <rect x="378" y="120" width="300" height="34" rx="10" fill="#232F3E"/>
    <circle cx="398" cy="137" r="5" fill="#FF9900"/>
    <circle cx="414" cy="137" r="5" fill="#5A6675"/>
    <circle cx="430" cy="137" r="5" fill="#5A6675"/>
    <text x="540" y="142" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Browser</text>

    <text x="528" y="182" font-size="16" font-weight="bold" fill="#232F3E" text-anchor="middle">Cloudscape SPA</text>
    <text x="528" y="203" font-size="12" fill="#5A6675" text-anchor="middle">Vite + React + TypeScript</text>

    <rect x="400" y="222" width="256" height="76" rx="8" fill="#FFFFFF" stroke="#C6CDD6"/>
    <text x="528" y="243" font-size="11" font-weight="bold" fill="#8A94A6" text-anchor="middle" letter-spacing="1">IN THE BUNDLE</text>
    <text x="528" y="263" font-size="11.5" fill="#232F3E" text-anchor="middle">public identifiers only —</text>
    <text x="528" y="280" font-size="11.5" fill="#232F3E" text-anchor="middle">pool IDs + region. No secret.</text>

    <rect x="400" y="314" width="256" height="118" rx="8" fill="#FFF8ED" stroke="#FF9900"/>
    <text x="528" y="335" font-size="11" font-weight="bold" fill="#B26A00" text-anchor="middle" letter-spacing="1">PERSONAS (COGNITO GROUPS)</text>
    <text x="528" y="356" font-size="11.5" fill="#232F3E" text-anchor="middle">Consumer — discover &amp; read</text>
    <text x="528" y="375" font-size="11.5" fill="#232F3E" text-anchor="middle">Publisher — author · submit · tag</text>
    <text x="528" y="394" font-size="11.5" fill="#232F3E" text-anchor="middle">Approver — approve / reject</text>
    <text x="528" y="415" font-size="10.5" fill="#8A94A6" text-anchor="middle">no admin persona — registry creation is out of scope</text>

    <text x="528" y="462" font-size="13" font-weight="bold" fill="#1B7F37" text-anchor="middle">No application server</text>
    <text x="528" y="481" font-size="11.5" fill="#5A6675" text-anchor="middle">nothing to run, patch, or pay for</text>
    <text x="528" y="519" font-size="11.5" fill="#5A6675" text-anchor="middle">temporary credentials held in memory,</text>
    <text x="528" y="535" font-size="11.5" fill="#5A6675" text-anchor="middle">re-vended on expiry</text>
  </g>

  <line id="cf-to-browser" x1="310" y1="200" x2="378" y2="200" stroke="#8A94A6" stroke-width="1.8" marker-end="url(#arrowLight)"/>
  <text x="344" y="192" font-size="10" fill="#8A94A6" text-anchor="middle">SPA</text>

  <!-- ================= AWS services ================= -->
  <g id="aws-services">
    <rect x="746" y="120" width="454" height="430" rx="10" fill="#FAFBFC" stroke="#C6CDD6" stroke-dasharray="6 4"/>
    <text x="762" y="145" font-size="12" font-weight="bold" fill="#8A94A6" letter-spacing="1">AWS SERVICES — CALLED DIRECTLY FROM THE BROWSER</text>

    <g id="user-pool">
      <rect x="766" y="162" width="414" height="76" rx="8" fill="#FFFFFF" stroke="#DD344C" stroke-width="2"/>
      <rect x="766" y="162" width="414" height="26" rx="8" fill="#DD344C"/>
      <text x="973" y="180" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Amazon Cognito — User Pool</text>
      <text x="973" y="207" font-size="12" fill="#232F3E" text-anchor="middle">password auth · returns ID / access / refresh JWTs</text>
      <text x="973" y="225" font-size="11" fill="#5A6675" text-anchor="middle">ID token carries cognito:groups</text>
    </g>

    <g id="identity-pool">
      <rect x="766" y="264" width="414" height="76" rx="8" fill="#FFFFFF" stroke="#DD344C" stroke-width="2"/>
      <rect x="766" y="264" width="414" height="26" rx="8" fill="#DD344C"/>
      <text x="973" y="282" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Amazon Cognito — Identity Pool</text>
      <text x="973" y="309" font-size="12" fill="#232F3E" text-anchor="middle">group → scoped IAM role (cognito:preferred_role)</text>
      <text x="973" y="327" font-size="11" fill="#5A6675" text-anchor="middle">vends short-lived persona-scoped credentials</text>
    </g>

    <g id="control-plane">
      <rect x="766" y="374" width="414" height="70" rx="8" fill="#FFFFFF" stroke="#01A88D" stroke-width="2"/>
      <rect x="766" y="374" width="414" height="26" rx="8" fill="#01A88D"/>
      <text x="973" y="392" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">agent-registry-control — control plane</text>
      <text x="973" y="419" font-size="11.5" fill="#232F3E" text-anchor="middle">registries · records · approval lifecycle</text>
      <text x="973" y="436" font-size="11" fill="#5A6675" text-anchor="middle">create / update / submit / approve / reject</text>
    </g>

    <g id="data-plane">
      <rect x="766" y="462" width="414" height="70" rx="8" fill="#FFFFFF" stroke="#01A88D" stroke-width="2"/>
      <rect x="766" y="462" width="414" height="26" rx="8" fill="#01A88D"/>
      <text x="973" y="480" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">agent-registry — data plane · registry MCP endpoint</text>
      <text x="973" y="507" font-size="11.5" fill="#232F3E" text-anchor="middle">semantic search over APPROVED records</text>
      <text x="973" y="524" font-size="11" fill="#5A6675" text-anchor="middle">the same endpoint + token you give Kiro or Amazon Quick</text>
    </g>
  </g>

  <!-- ================= numbered flows ================= -->
  <g id="flows" font-size="11.5">
    <g id="flow-1">
      <line x1="678" y1="196" x2="766" y2="196" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)"/>
      <circle cx="712" cy="176" r="11" fill="#232F3E"/>
      <text x="712" y="180" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="722" y="214" fill="#5A6675" text-anchor="middle">sign in</text>
    </g>
    <g id="flow-2">
      <line x1="678" y1="298" x2="766" y2="298" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)"/>
      <circle cx="712" cy="278" r="11" fill="#232F3E"/>
      <text x="712" y="282" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="722" y="316" fill="#5A6675" text-anchor="middle">exchange</text>
    </g>
    <g id="flow-3">
      <line x1="678" y1="409" x2="766" y2="409" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)"/>
      <circle cx="700" cy="388" r="11" fill="#232F3E"/>
      <text x="700" y="392" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="734" y="370" fill="#5A6675" text-anchor="middle">SigV4 · always IAM</text>
    </g>
    <g id="flow-4">
      <path d="M 678 440 L 722 440 L 722 497 L 766 497" fill="none" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)"/>
      <circle cx="694" cy="497" r="11" fill="#232F3E"/>
      <text x="694" y="501" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
      <text x="700" y="528" fill="#5A6675" text-anchor="middle">Bearer JWT</text>
    </g>
  </g>

  <!-- ================= footer note ================= -->
  <g id="footer">
    <rect x="40" y="586" width="1160" height="66" rx="8" fill="#F0F7F2" stroke="#1B7F37"/>
    <text x="60" y="608" font-size="13" font-weight="bold" fill="#1B7F37">AWS is the real authorization gate</text>
    <text x="60" y="628" font-size="12" fill="#232F3E">The UI showing or hiding an action is only a convenience layer. An out-of-role call fails at the AWS layer: a Consumer's CreateRegistryRecord is denied</text>
    <text x="60" y="645" font-size="12" fill="#232F3E">by IAM, and discovery fails if the registry's JWT authorizer rejects the token — not merely hidden in the UI.</text>
  </g>

  <g id="caption">
    <text x="40" y="690" font-size="11.5" fill="#8A94A6">Deployed by deploy/setup/01-foundation.sh (Cognito + IAM) and deploy/setup/05-site.sh (S3 + CloudFront + OAC).</text>
    <text x="40" y="710" font-size="11.5" fill="#8A94A6">Editable source: docs/architecture.svg — re-render with: rsvg-convert -w 1240 docs/architecture.svg -o docs/architecture.png</text>
  </g>
</svg>
