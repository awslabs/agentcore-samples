[project]
name = "mcp-keycloak-auth"
version = "0.1.0"
description = "MCP Proxy with Keycloak DCR authentication for AgentCore"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "httpx",
    "requests",
    "python-dotenv",
]

[project.scripts]
mcp_proxy = "mcp_proxy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
