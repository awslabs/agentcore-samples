  html { font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }

  .node { position:absolute; cursor:pointer; border-radius:12px; border:1.5px solid; display:flex; flex-direction:column;
          justify-content:center; align-items:center; text-align:center; padding:4px 8px; transition: opacity .15s, box-shadow .15s; }
  .node:hover { box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .node.sel { border-width: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.16); }
  .node.dim { opacity: .25; }
  .edge { transition: opacity .15s; }
  .edge.dim { opacity: .12; }

  .zonehit:hover .zlink { background:#f5f3ff; }
  .src { background:#0f172a; color:#e2e8f0; border-radius:10px; padding:10px 0; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x:auto; }
  .src .row { white-space:pre; padding:0 14px 0 0; }

{
 "dockerfile": "# syntax=docker/dockerfile:1.7\n# The dev box: openvscode-server, Claude Code (CLI + VS Code extension), the AWS CLI and the MCP\n# proxy, behind the Node proxy that is the box's only way in. Every download is pinned and checked.\n#   docker buildx build --platform linux/arm64 --load -t devbox-box:dev .\n\n# The base: Ubuntu 24.04 from ECR Public (the Docker Official Images mirror), pinned by the digest of its\n# multi-arch index (both stages pick its linux/arm64 image). To update it, change the digest here.\nARG UBUNTU=public.ecr.aws/docker/library/ubuntu:24.04@sha256:a853f94d226358a79c740cfc7bce0c289748f3fe3488d921d038ccd752c61b60\n\n# ---- fetch: download each pinned artifact and verify it before anything else sees it ----------\nFROM --platform=linux/arm64 ${UBUNTU} AS fetch\nARG OVS_VERSION=1.109.5\nARG OVS_COMMIT=072586267e68ece9a47aa43f8c108e0dcbf44622\nARG OVS_SHA256=36d9c14036489b63de84ebace837fcacf7e60e669a0dc715802c5443684ea4dc\nARG CLAUDE_VERSION=2.1.277\nARG CLAUDE_VSIX_SHA256=e55b34b71c130b89f2fc0e48eca5bfe67fbd7576b539c8c3e359a73004f141b9\nARG CLAUDE_KEY_FPR=31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE\nARG AWSCLI_VERSION=2.37.5\nARG AWSCLI_SHA256=95d2bac9242185ae3a2970ec38c8766d3bf7b31609a0302dec3643522a676d32\nARG AWSCLI_KEY_FPR=FB5DB77FD5C118B80511ADA8A6310ACC4672475C\n# Packages that openvscode-server 1.109.5 bundles, replaced with newer releases from the npm registry, each\n# checked by its SHA-512. Drop an entry once an upstream openvscode-server release ships that version. ip-address\n# 10.x is a major version, so socks (its only user, for VS Code's SOCKS proxy support) moves with it to a release\n# built on 10.x (socks 2.8.7 and later).\nARG OVS_NODE_FIXES=\"\\\nshell-quote@1.9.0=sha512-Iov+JwFv/2HcTpcwNMKd8+IWNb8tboQJNQTkAY/LLVK7gGH9jy+LGkVqPxfekHl+yMmiqXszdGWXgkfml7hjqA== \\\nundici@7.29.1=sha512-RYONW2MeafgYlkVOKYKkA/Ag7BmXqgIWCa8t1m0JcxrQg9pI9lEqRhAOruOBCbAohOa/gkCF+iPi9hrgvTzu6Q== \\\nlodash-es@4.18.0=sha512-koAgswPPA+UTaPN64Etp+PGP+WT6oqOS2NMi5yDkMaiGw9qY4VxQbQF0mtKMyr4BlTznWyzePV5UpECTJQmSUA== \\\npicomatch@4.0.4=sha512-QP88BAKvMam/3NxH6vj2o21R6MjxZUAd6nlwAS/pnGvN9IVLocLHxGYIzFhg6fUQ+5th6P4dv4eW9jX3DSIj7A== \\\nsocks@2.8.10=sha512-e0VyvkVTwVYViNovRkZ9aodhxVlyoMn7eJhVUPxZ+eK9P/7CBkxvvsBOHqFPEH416726W8tLXXXjKwqgTErrCQ== \\\nip-address@10.7.3=sha512-A1kdq/tSb5QjvKvAMgIoEvDBIgL7qaqVP/jkvSwYYRZ9iEzvPpopxp2wQfu3SuZRHtpHNxMn8Fs0bS+gf5Xmwg==\"\nSHELL [\"/bin/bash\", \"-o\", \"pipefail\", \"-c\"]\nRUN apt-get update \\\n && apt-get install -y --no-install-recommends ca-certificates curl gnupg jq openssl unzip \\\n && rm -rf /var/lib/apt/lists/*\nCOPY keys/aws-cli.asc proxy/package-lock.json /in/\nWORKDIR /out\nRUN set -eux; \\\n    ovs=\"https://github.com/gitpod-io/openvscode-server/releases/download/openvscode-server-v${OVS_VERSION}\"; \\\n    curl -fsSL -o ovs.tgz \"${ovs}/openvscode-server-v${OVS_VERSION}-linux-arm64.tar.gz\"; \\\n    echo \"${OVS_SHA256}  ovs.tgz\" | sha256sum -c -; \\\n    mkdir ovs; tar -xzf ovs.tgz -C ovs --strip-components=1 --no-same-owner; rm ovs.tgz; \\\n    test \"$(jq -r .commit ovs/product.json)\" = \"${OVS_COMMIT}\"; \\\n    \\\n    vsix=\"https://open-vsx.org/api/Anthropic/claude-code/linux-arm64/${CLAUDE_VERSION}/file/Anthropic.claude-code-${CLAUDE_VERSION}@linux-arm64\"; \\\n    curl -fsSL -o cc.vsix \"${vsix}.vsix\"; \\\n    curl -fsSL -o cc.sha256 \"${vsix}.sha256\"; \\\n    test \"$(tr -d '[:space:]' < cc.sha256 | cut -c1-64)\" = \"${CLAUDE_VSIX_SHA256}\"; \\\n    echo \"${CLAUDE_VSIX_SHA256}  cc.vsix\" | sha256sum -c -; \\\n    mkdir vsix; unzip -q cc.vsix -d vsix; rm cc.vsix cc.sha256; \\\n    test \"$(jq -r '.publisher + \".\" + .name + \"@\" + .version' vsix/extension/package.json)\" = \"Anthropic.claude-code@${CLAUDE_VERSION}\"; \\\n    \\\n    curl -fsSL -o claude-code.asc https://downloads.claude.ai/keys/claude-code.asc; \\\n    export GNUPGHOME=\"$(mktemp -d)\"; \\\n    test \"$(gpg --batch --with-colons --show-keys claude-code.asc | grep -c '^pub:')\" = 1; \\\n    test \"$(gpg --batch --with-colons --show-keys claude-code.asc | awk -F: '$1 == \"fpr\" {print $10; exit}')\" = \"${CLAUDE_KEY_FPR}\"; \\\n    \\\n    aws=\"https://awscli.amazonaws.com/awscli-exe-linux-aarch64-${AWSCLI_VERSION}.zip\"; \\\n    curl -fsSL -o awscli.zip \"${aws}\"; \\\n    curl -fsSL -o awscli.zip.sig \"${aws}.sig\"; \\\n    echo \"${AWSCLI_SHA256}  awscli.zip\" | sha256sum -c -; \\\n    gpg --batch --quiet --import /in/aws-cli.asc; \\\n    gpg --batch --status-fd 1 --verify awscli.zip.sig awscli.zip 2>/dev/null | grep -q \"VALIDSIG ${AWSCLI_KEY_FPR}\"; \\\n    unzip -q awscli.zip; rm awscli.zip awscli.zip.sig; \\\n    \\\n    test \"$(jq -c '.packages | keys' /in/package-lock.json)\" = '[\"\",\"node_modules/ws\"]'; \\\n    url=\"$(jq -r '.packages[\"node_modules/ws\"].resolved' /in/package-lock.json)\"; \\\n    sri=\"$(jq -r '.packages[\"node_modules/ws\"].integrity' /in/package-lock.json)\"; \\\n    [[ $url == https://registry.npmjs.org/ws/-/ws-*.tgz ]]; \\\n    curl -fsSL -o ws.tgz \"${url}\"; \\\n    test \"sha512-$(openssl dgst -sha512 -binary ws.tgz | base64 -w0)\" = \"${sri}\"; \\\n    mkdir -p node_modules/ws; tar -xzf ws.tgz -C node_modules/ws --strip-components=1 --no-same-owner; rm ws.tgz\nRUN set -eux; \\\n    for fix in ${OVS_NODE_FIXES}; do \\\n      pkg=\"${fix%%@*}\"; ver=\"${fix#*@}\"; ver=\"${ver%%=*}\"; sri=\"${fix#*=}\"; \\\n      test -f \"ovs/node_modules/${pkg}/package.json\"; \\\n      curl -fsSL -o fix.tgz \"https://registry.npmjs.org/${pkg}/-/${pkg}-${ver}.tgz\"; \\\n      test \"sha512-$(openssl dgst -sha512 -binary fix.tgz | base64 -w0)\" = \"${sri}\"; \\\n      rm -rf \"ovs/node_modules/${pkg}\"; mkdir \"ovs/node_modules/${pkg}\"; \\\n      tar -xzf fix.tgz -C \"ovs/node_modules/${pkg}\" --strip-components=1 --no-same-owner; rm fix.tgz; \\\n      test \"$(jq -r .version \"ovs/node_modules/${pkg}/package.json\")\" = \"${ver}\"; \\\n    done\n\n# ---- the box ---------------------------------------------------------------------------------\nFROM --platform=linux/arm64 ${UBUNTU}\nARG CLAUDE_VERSION=2.1.277\nARG AWSCLI_VERSION=2.37.5\nARG BUILD_DATE=unknown\nARG SOURCE_REVISION=unknown\nENV LANG=C.UTF-8\nSHELL [\"/bin/bash\", \"-o\", \"pipefail\", \"-c\"]\n\n# One layer for everything big, so the image stays well under AgentCore's 2 GB and 53 layers.\nRUN --mount=type=bind,from=fetch,source=/out,target=/fetch \\\n    --mount=type=bind,source=requirements-mcp-proxy.txt,target=/tmp/requirements-mcp-proxy.txt \\\n    set -eux; \\\n    export DEBIAN_FRONTEND=noninteractive; \\\n    apt-get update; \\\n    apt-get install -y --no-install-recommends ca-certificates curl git tmux jq unzip python3 python3-venv \\\n      less openssh-client procps; \\\n    install -d -m 0755 /etc/apt/keyrings; \\\n    install -m 0644 /fetch/claude-code.asc /etc/apt/keyrings/claude-code.asc; \\\n    echo \"deb [signed-by=/etc/apt/keyrings/claude-code.asc] https://downloads.claude.ai/claude-code/apt/stable stable main\" \\\n      > /etc/apt/sources.list.d/claude-code.list; \\\n    apt-get update; \\\n    apt-get install -y --no-install-recommends \"claude-code=${CLAUDE_VERSION}-1\"; \\\n    apt-mark hold claude-code; \\\n    apt-get clean; rm -rf /var/lib/apt/lists/*; \\\n    \\\n    cp -a /fetch/ovs /opt/openvscode-server; \\\n    # No extension gallery on the box, so neither the server CLI nor a server-side\n    # install can reach open-vsx.org. commit, quality and version stay (the proxy, the supervisor\n    # and build-info read them).\n    jq 'del(.extensionsGallery)' /opt/openvscode-server/product.json > /tmp/product.json; \\\n    install -m 0644 /tmp/product.json /opt/openvscode-server/product.json; rm /tmp/product.json; \\\n    test \"$(jq -c '[has(\"extensionsGallery\"), (.commit | length), .quality]' /opt/openvscode-server/product.json)\" = '[false,40,\"stable\"]'; \\\n    ext=/opt/openvscode-server/extensions/anthropic.claude-code; \\\n    cp -a /fetch/vsix/extension \"${ext}\"; \\\n    # The VSIX bundles its own copy of the same CLI build; one hard-linked copy saves ~230 MB.\n    if cmp -s /usr/bin/claude \"${ext}/resources/native-binary/claude\"; then \\\n      ln -f /usr/bin/claude \"${ext}/resources/native-binary/claude\"; fi; \\\n    # The server's --extensions-dir: root-owned and read-only, holding the\n    # extensions.json the server itself writes on first use, so the running server starts cleanly\n    # and can't install or side-load anything. Claude Code is found as a system extension above.\n    install -d -m 0755 /opt/devbox/extensions; \\\n    /opt/openvscode-server/bin/openvscode-server --server-data-dir /tmp/ovs-build \\\n      --extensions-dir /opt/devbox/extensions --list-extensions; \\\n    rm -rf /tmp/ovs-build; \\\n    test \"$(jq -c . /opt/devbox/extensions/extensions.json)\" = '[]'; \\\n    chmod -R a-w /opt/devbox/extensions; \\\n    \\\n    /fetch/aws/install -i /usr/local/aws-cli -b /usr/local/bin; \\\n    python3 -m venv /opt/mcp-proxy; \\\n    /opt/mcp-proxy/bin/pip install --no-cache-dir --disable-pip-version-check --require-hashes \\\n      --only-binary=:all: --no-deps -r /tmp/requirements-mcp-proxy.txt; \\\n    # pip is only needed to install the pinned set above.\n    /opt/mcp-proxy/bin/python -m pip uninstall -y --disable-pip-version-check pip; \\\n    mkdir -p /opt/devbox/proxy; \\\n    cp -a /fetch/node_modules /opt/devbox/proxy/node_modules; \\\n    \\\n    # ubuntu:24.04 ships a user \"ubuntu\" with uid 1000.\n    userdel -r ubuntu 2>/dev/null || true; \\\n    groupadd --gid 1000 dev; \\\n    useradd --uid 1000 --gid 1000 --home-dir /mnt/workspace/home --no-create-home --shell /bin/bash dev; \\\n    groupadd --system --gid 1001 devboxproxy; \\\n    useradd --system --uid 1001 --gid 1001 --home-dir /nonexistent --no-create-home \\\n      --shell /usr/sbin/nologin devboxproxy\n\nCOPY rootfs/ /\nCOPY proxy/package.json proxy/package-lock.json proxy/server.mjs /opt/devbox/proxy/\nCOPY proxy/lib/ /opt/devbox/proxy/lib/\n\nRUN set -eux; \\\n    install -d -m 0755 /etc/devbox /etc/claude-code/managed-settings.d /run/devbox; \\\n    chown -R root:root /etc/claude-code /etc/devbox /opt /usr/local/bin; \\\n    chmod -R go-w /etc/claude-code /etc/devbox /opt /usr/local/bin; \\\n    find /etc/claude-code -type f -exec chmod 0644 {} +; \\\n    chmod 0755 /etc/claude-code/hooks/*.py /usr/local/bin/devbox-entrypoint /usr/local/bin/devbox-claude \\\n      /opt/devbox/lib/devbox/dev_helper.py; \\\n    # Nothing in the image may raise privileges: strip setuid/setgid from the base image too.\n    find / -xdev -type f -perm /6000 -exec chmod ug-s {} +; \\\n    jq -n --arg built \"${BUILD_DATE}\" --arg rev \"${SOURCE_REVISION}\" --arg claude \"${CLAUDE_VERSION}\" \\\n      --arg awscli \"${AWSCLI_VERSION}\" \\\n      --arg ovs \"$(jq -r .version /opt/openvscode-server/product.json)\" \\\n      --arg commit \"$(jq -r .commit /opt/openvscode-server/product.json)\" \\\n      --arg vsix \"$(jq -r .version /opt/openvscode-server/extensions/anthropic.claude-code/package.json)\" \\\n      --arg ws \"$(jq -r .version /opt/devbox/proxy/node_modules/ws/package.json)\" \\\n      --arg mcp \"$(/opt/mcp-proxy/bin/python -c 'import importlib.metadata as m; print(m.version(\"mcp-proxy-for-aws\"))')\" \\\n      '{built: $built, revision: $rev, openvscodeServer: $ovs, commit: $commit, claudeCode: $claude, \\\n        claudeVsix: $vsix, awsCli: $awscli, mcpProxyForAws: $mcp, ws: $ws}' > /opt/devbox/build-info.json\n\nEXPOSE 8080\n# CMD, not ENTRYPOINT: AgentCore Instances started the ENTRYPOINT-only image as \"exited before\n# becoming ready\" with no output at all; the AWS Instances samples all start through CMD.\nCMD [\"/usr/local/bin/devbox-entrypoint\"]\n",
 "managed": "{\n  \"env\": {\n    \"CLAUDE_CODE_USE_BEDROCK\": \"1\",\n    \"AWS_REGION\": \"us-east-1\",\n    \"AWS_PROFILE\": \"devbox\",\n    \"AWS_CONFIG_FILE\": \"/etc/devbox/aws-config\",\n    \"AWS_SHARED_CREDENTIALS_FILE\": \"/dev/null\",\n    \"AWS_EC2_METADATA_DISABLED\": \"true\",\n    \"AWS_CONTAINER_CREDENTIALS_FULL_URI\": \"\",\n    \"AWS_CONTAINER_CREDENTIALS_RELATIVE_URI\": \"\",\n    \"CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC\": \"1\",\n    \"CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY\": \"1\",\n    \"CLAUDE_CODE_DISABLE_OFFICIAL_MARKETPLACE_AUTOINSTALL\": \"1\",\n    \"CLAUDE_CODE_IDE_SKIP_AUTO_INSTALL\": \"1\",\n    \"DISABLE_UPDATES\": \"1\",\n    \"DISABLE_INSTALLATION_CHECKS\": \"1\"\n  },\n  \"awsAuthRefresh\": \"aws sso login --sso-session devbox --use-device-code --no-browser\",\n  \"skipWebFetchPreflight\": true,\n  \"allowManagedHooksOnly\": true,\n  \"allowManagedPermissionRulesOnly\": true,\n  \"allowManagedMcpServersOnly\": true,\n  \"allowedMcpServers\": [{ \"serverName\": \"web-search\" }],\n  \"strictKnownMarketplaces\": [],\n  \"disableSideloadFlags\": true,\n  \"permissions\": {\n    \"disableBypassPermissionsMode\": \"disable\",\n    \"deny\": [\n      \"WebFetch\",\n      \"WebSearch\",\n      \"Bash(psql *)\",\n      \"Bash(mysql *)\",\n      \"Bash(mongosh *)\",\n      \"Bash(redis-cli *)\",\n      \"Bash(aws * --profile *)\",\n      \"Bash(aws *)\",\n      \"Bash(claude mcp *)\",\n      \"Bash(claude plugin *)\",\n      \"Bash(claude plugins *)\",\n      \"Read(~/.aws/**)\",\n      \"Read(~/.ssh/**)\",\n      \"Read(~/.pgpass)\",\n      \"Read(./.env)\",\n      \"Read(./.env.*)\",\n      \"Read(./secrets/**)\",\n      \"Edit(//etc/claude-code/**)\",\n      \"Edit(//etc/devbox/**)\",\n      \"Edit(//opt/**)\"\n    ]\n  },\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Bash|Write|Edit|MultiEdit|NotebookEdit\",\n        \"hooks\": [\n          { \"type\": \"command\", \"command\": \"/usr/bin/python3 -I /etc/claude-code/hooks/block-direct-access.py\" }\n        ]\n      }\n    ],\n    \"SessionStart\": [\n      {\n        \"hooks\": [\n          { \"type\": \"command\", \"command\": \"/usr/bin/python3 -I /etc/claude-code/hooks/last-session.py\" }\n        ]\n      }\n    ],\n    \"UserPromptSubmit\": [\n      {\n        \"hooks\": [\n          { \"type\": \"command\", \"command\": \"/usr/bin/python3 -I /etc/claude-code/hooks/agent-busy.py\" }\n        ]\n      }\n    ],\n    \"PostToolUse\": [\n      {\n        \"matcher\": \"*\",\n        \"hooks\": [\n          { \"type\": \"command\", \"command\": \"/usr/bin/python3 -I /etc/claude-code/hooks/agent-busy.py\", \"async\": true }\n        ]\n      }\n    ],\n    \"Stop\": [\n      {\n        \"hooks\": [\n          { \"type\": \"command\", \"command\": \"/usr/bin/python3 -I /etc/claude-code/hooks/last-session.py\", \"async\": true },\n          { \"type\": \"command\", \"command\": \"/usr/bin/python3 -I /etc/claude-code/hooks/agent-busy.py\", \"async\": true }\n        ]\n      }\n    ],\n    \"SessionEnd\": [\n      {\n        \"hooks\": [\n          { \"type\": \"command\", \"command\": \"/usr/bin/python3 -I /etc/claude-code/hooks/agent-busy.py\" }\n        ]\n      }\n    ]\n  }\n}\n",
 "hook": "#!/usr/bin/python3 -I\n\"\"\"Org policy hook (dev box): block direct resource access from Claude Code's Bash tool,\nblock secrets written into files (Write/Edit/MultiEdit/NotebookEdit), and keep the agent\naway from the box's own setup (managed settings, the AWS config, /opt).\n\nUnix permissions already stop the dev user writing\n/etc/claude-code, /etc/devbox and /opt; this hook is the guard rail that explains why.\"\"\"\n\nimport json\nimport os\nimport re\nimport sys\n\nSECRETS = [\n    (\n        r\"\\b(postgres(ql)?|mysql|mariadb|mongodb(\\+srv)?|rediss?|mssql|sqlserver)://|jdbc:[a-z0-9]+:\",\n        \"database connection strings aren't allowed\",\n    ),\n    (r\"\\b(AKIA|ASIA)[0-9A-Z]{16}\\b\", \"AWS access keys can't be used\"),\n    (r\"(?i)\\baws_(secret_access_key|session_token|access_key_id)\\s*=\", \"setting AWS credentials isn't allowed\"),\n]\n# The IdC token cache lives in ~/.aws/sso on the box.\nCRED_FILES = (r\"\\.aws/(credentials|config|sso)\\b|\\.ssh/|\\.pgpass\\b\", \"credential files are off limits\")\nORG_SETUP = \"the org's Claude Code setup (managed settings, MCP servers, plugins, this hook) can't be changed from here\"\nBOX_PATHS = r\"/etc/claude-code\\b|/etc/devbox\\b|(^|[\\s'\\\"=:;|&(])/opt(/|\\b)\"\nOWN_IDENTITY = \"only this session's own AWS identity may be used\"\nAWS_VARS = r\"AWS_(PROFILE|DEFAULT_PROFILE|CONFIG_FILE|SHARED_CREDENTIALS_FILE)\"\n\n\ndef bash_rules():\n    return [\n        (\n            r\"\\b(psql|pg_dump|mysql|mysqldump|mongosh|mongo|redis-cli|sqlcmd|sqlplus|cqlsh)\\b\",\n            \"direct database clients aren't allowed; use the approved org tools\",\n        ),\n        *SECRETS,\n        (r\"--profile\\b\", OWN_IDENTITY),\n        # Re-pointing or clearing the AWS SDK settings would sidestep AWS_PROFILE=devbox.\n        (\n            r\"\\b\"\n            + AWS_VARS\n            + r\"\\s*=|\\bunset\\b[^;|&]*\\b\"\n            + AWS_VARS\n            + r\"\\b|\\benv\\b[^;|&]*\\s(-u\\s*|--unset[= ])\"\n            + AWS_VARS\n            + r\"\\b|\\benv\\s+(-i|--ignore-environment)\\b\",\n            OWN_IDENTITY,\n        ),\n        CRED_FILES,\n        (\n            BOX_PATHS\n            + r\"|\\bclaude\\s+(mcp|plugins?)\\b|\\bclaude\\b[^|;&]*--(mcp-config|strict-mcp-config|plugin-dir|settings)\\b\",\n            ORG_SETUP,\n        ),\n    ]\n\n\ndef protected_path(path, cwd):\n    if not path:\n        return False\n    joined = os.path.join(cwd or \"/\", path)\n    # As written and as resolved: a symlink in the workspace can point into /etc/claude-code.\n    for full in {os.path.normpath(joined), os.path.realpath(joined)}:\n        if re.match(r\"/(etc/claude-code|etc/devbox|opt)(/|\\Z)\", full):\n            return True\n        if re.search(r\"(^|/)\\.claude/settings(\\.local)?\\.json\\Z|managed-(mcp|settings)\\.json\\Z\", full):\n            return True\n    return False\n\n\ndef decide(event):\n    \"\"\"Returns the deny reason, or None to let the call through.\"\"\"\n    tool = event.get(\"tool_name\", \"Bash\")\n    inp = event.get(\"tool_input\") or {}\n    if tool == \"Bash\":\n        text = inp.get(\"command\", \"\")\n        rules = bash_rules()\n    else:  # a file write: check where it goes and what goes into it\n        parts = [\n            inp.get(\"file_path\", \"\"),\n            inp.get(\"notebook_path\", \"\"),\n            inp.get(\"content\", \"\"),\n            inp.get(\"new_string\", \"\"),\n            inp.get(\"new_source\", \"\"),\n        ]\n        parts += [e.get(\"new_string\", \"\") for e in inp.get(\"edits\") or [] if isinstance(e, dict)]\n        text = \"\\n\".join(p for p in parts if isinstance(p, str))\n        rules = [*SECRETS, CRED_FILES]\n        for p in (inp.get(\"file_path\"), inp.get(\"notebook_path\")):\n            if isinstance(p, str) and protected_path(p, event.get(\"cwd\")):\n                return ORG_SETUP  # where it goes is enough\n    if not isinstance(text, str):\n        return None\n    for pattern, reason in rules:\n        if re.search(pattern, text):\n            return reason\n    return None\n\n\ndef main():\n    try:\n        event = json.load(sys.stdin)\n    except ValueError:\n        return 0\n    reason = decide(event) if isinstance(event, dict) else None\n    if reason:\n        print(\n            json.dumps(\n                {\n                    \"hookSpecificOutput\": {\n                        \"hookEventName\": \"PreToolUse\",\n                        \"permissionDecision\": \"deny\",\n                        \"permissionDecisionReason\": f\"Blocked by org policy: {reason}.\",\n                    }\n                }\n            )\n        )\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n",
 "config": "\"\"\"Files the root entrypoint writes from the runtime environment. Pure functions, so they can be\ntested without a box. Values come from the deploy (trusted), but they end up in INI and JSON\nfiles that decide who the box signs in as, so each one is checked before it's written. The checks\nare whole-string matches: with re.match and \"$\", a trailing newline would slip through and start\na new INI line.\"\"\"\n\nimport json\nimport os\nimport re\nimport tempfile\n\nSSO_SESSION = \"devbox\"\nAWS_PROFILE = \"devbox\"\nREGION = \"us-east-1\"\nTOOLS_SERVER = \"web-search\"\nMCP_PROXY = \"/opt/mcp-proxy/bin/mcp-proxy-for-aws\"\nDEVBOX_CLAUDE = \"/usr/local/bin/devbox-claude\"\nPROJECTS = \"/mnt/workspace/projects\"\n_VERSION = re.compile(r\"\\d+\\.\\d+\\.\\d+\")\n\n_START_URL = re.compile(r\"https://[A-Za-z0-9.-]+(:\\d{1,5})?(/[A-Za-z0-9._~/-]*)?\")\n_REGION = re.compile(r\"[a-z]{2}(-[a-z]+)+-\\d{1,2}\")\n_ACCOUNT = re.compile(r\"\\d{12}\")\n_ROLE = re.compile(r\"[A-Za-z0-9+=,.@_-]{1,64}\")\n_GATEWAY_URL = re.compile(r\"https://[A-Za-z0-9.-]+(:\\d{1,5})?(/[A-Za-z0-9._~%/-]*)?\")\n# Model ids, inference profile ids and ARNs, including a \"[1m]\" style suffix.\n_MODEL_ID = re.compile(r\"[A-Za-z0-9._:/\\-\\[\\]]{1,256}\")\n_ALIASES = (\"opus\", \"sonnet\", \"haiku\")\n\n\nclass ConfigError(ValueError):\n    pass\n\n\ndef aws_config(env):\n    \"\"\"The root-owned AWS_CONFIG_FILE: one IdC session and one profile, the owner's tier role.\"\"\"\n    fields = {\n        \"DEVBOX_SSO_START_URL\": _START_URL,\n        \"DEVBOX_SSO_REGION\": _REGION,\n        \"DEVBOX_ACCOUNT_ID\": _ACCOUNT,\n        \"DEVBOX_SSO_ROLE\": _ROLE,\n    }\n    bad = [name for name, rule in fields.items() if not rule.fullmatch(env.get(name, \"\"))]\n    if bad:\n        raise ConfigError(\"missing or invalid: \" + \", \".join(bad))\n    return (\n        f\"[sso-session {SSO_SESSION}]\\n\"\n        f\"sso_start_url = {env['DEVBOX_SSO_START_URL']}\\n\"\n        f\"sso_region = {env['DEVBOX_SSO_REGION']}\\n\"\n        \"sso_registration_scopes = sso:account:access\\n\"\n        f\"[profile {AWS_PROFILE}]\\n\"\n        f\"sso_session = {SSO_SESSION}\\n\"\n        f\"sso_account_id = {env['DEVBOX_ACCOUNT_ID']}\\n\"\n        f\"sso_role_name = {env['DEVBOX_SSO_ROLE']}\\n\"\n        f\"region = {REGION}\\n\"\n    )\n\n\ndef tier_dropin(models_json):\n    \"\"\"managed-settings.d/20-tier.json from DEVBOX_MODELS.\n\n    Accepts either an alias map {\"opus\": \"<id>\", \"sonnet\": \"<id>\", ...} or settings-shaped JSON\n    {\"availableModels\": [...], \"model\": \"...\", \"env\": {\"ANTHROPIC_DEFAULT_SONNET_MODEL\": \"...\"}}\n    (the ANTHROPIC_DEFAULT_* keys may also sit at the top level).\"\"\"\n    try:\n        data = json.loads(models_json)\n    except (TypeError, ValueError) as err:\n        raise ConfigError(f\"DEVBOX_MODELS is not JSON: {err}\") from None\n    if not isinstance(data, dict):\n        raise ConfigError(\"DEVBOX_MODELS must be a JSON object\")\n    env = {}\n    sources = [data, data.get(\"env\") if isinstance(data.get(\"env\"), dict) else {}]\n    for source in sources:\n        for alias in _ALIASES:\n            key = f\"ANTHROPIC_DEFAULT_{alias.upper()}_MODEL\"\n            for name in (key, alias):\n                value = source.get(name)\n                if isinstance(value, str) and _MODEL_ID.fullmatch(value):\n                    env[key] = value\n    listed = data.get(\"availableModels\")\n    if listed is not None:\n        if not isinstance(listed, list) or not all(isinstance(m, str) and _MODEL_ID.fullmatch(m) for m in listed):\n            raise ConfigError(\"availableModels must be a list of model names\")\n        available = list(dict.fromkeys(listed))\n    else:\n        available = [a for a in _ALIASES if f\"ANTHROPIC_DEFAULT_{a.upper()}_MODEL\" in env]\n    if not available:\n        raise ConfigError(\"DEVBOX_MODELS names no models\")\n    model = data.get(\"model\")\n    if not (isinstance(model, str) and model in available):\n        model = \"sonnet\" if \"sonnet\" in available else available[0]\n    return {\"model\": model, \"availableModels\": available, \"enforceAvailableModels\": True, \"env\": env}\n\n\ndef managed_mcp(gateway_url):\n    \"\"\"The one MCP server Claude may use. Literal values, never ${VAR}: a variable would be read\n    from each user's environment, so the user could point it anywhere.\"\"\"\n    if not gateway_url:\n        return {\"mcpServers\": {}}\n    if not _GATEWAY_URL.fullmatch(gateway_url):\n        raise ConfigError(\"DEVBOX_TOOLS_GATEWAY_URL is not an https URL\")\n    return {\n        \"mcpServers\": {\n            TOOLS_SERVER: {\n                \"type\": \"stdio\",\n                \"command\": MCP_PROXY,\n                \"args\": [\n                    gateway_url,\n                    \"--service\",\n                    \"bedrock-agentcore\",\n                    \"--profile\",\n                    AWS_PROFILE,\n                    \"--region\",\n                    REGION,\n                    \"--disable-telemetry\",\n                ],\n                \"env\": {\"AWS_CONFIG_FILE\": \"/etc/devbox/aws-config\", \"AWS_PROFILE\": AWS_PROFILE, \"AWS_REGION\": REGION},\n            }\n        }\n    }\n\n\ndef folder_open_tasks():\n    \"\"\"projects/.vscode/tasks.json: open the resumable Claude Code terminal when the folder opens\n    (the workbench sets task.allowAutomaticTasks to \"on\").\"\"\"\n    return {\n        \"version\": \"2.0.0\",\n        \"tasks\": [\n            {\n                \"label\": \"Claude Code\",\n                \"type\": \"process\",\n                \"command\": DEVBOX_CLAUDE,\n                \"isBackground\": True,\n                \"problemMatcher\": [],\n                \"presentation\": {\n                    \"reveal\": \"always\",\n                    \"panel\": \"dedicated\",\n                    \"focus\": True,\n                    \"echo\": False,\n                    \"close\": False,\n                },\n                \"runOptions\": {\"runOn\": \"folderOpen\", \"instanceLimit\": 1},\n            }\n        ],\n    }\n\n\ndef claude_onboarding(claude_version=None):\n    \"\"\"What dev's ~/.claude.json needs so the folder-open terminal opens at Claude's prompt, not at\n    the first-run theme picker, security notes and folder-trust question (whose default answer\n    exits). Trust on the projects folder covers every folder under it. dev_helper adds only the\n    keys that are missing, so nothing Claude or the person set is ever changed.\"\"\"\n    seed = {\n        \"numStartups\": 1,\n        \"hasCompletedOnboarding\": True,\n        \"theme\": \"dark\",\n        \"officialMarketplaceAutoInstallAttempted\": True,\n        \"projects\": {PROJECTS: {\"hasTrustDialogAccepted\": True, \"hasCompletedProjectOnboarding\": True}},\n    }\n    if isinstance(claude_version, str) and _VERSION.fullmatch(claude_version):\n        seed[\"lastOnboardingVersion\"] = claude_version\n    return seed\n\n\ndef sandbox_dropin(strict_ok, weak_ok):\n    \"\"\"managed-settings.d/30-sandbox.json, only when bwrap can make a user namespace here.\"\"\"\n    if not (strict_ok or weak_ok):\n        return None\n    sandbox = {\n        \"enabled\": True,\n        \"failIfUnavailable\": True,\n        \"allowUnsandboxedCommands\": False,\n        \"network\": {\"allowManagedDomainsOnly\": True},\n    }\n    if not strict_ok:\n        sandbox[\"enableWeakerNestedSandbox\"] = True\n    return {\"sandbox\": sandbox}\n\n\ndef write_root_file(path, text, mode=0o644):\n    \"\"\"Atomic write, so Claude Code never reads half a file (a malformed managed file stops it).\"\"\"\n    directory = os.path.dirname(path)\n    fd, tmp = tempfile.mkstemp(dir=directory, prefix=f\".{os.path.basename(path)}.\")\n    try:\n        with os.fdopen(fd, \"w\") as f:\n            f.write(text)\n            f.flush()\n            os.fsync(f.fileno())\n        os.chmod(tmp, mode)\n        os.replace(tmp, path)\n    except BaseException:\n        if os.path.exists(tmp):\n            os.unlink(tmp)\n        raise\n\n\ndef write_json(path, data, mode=0o644):\n    write_root_file(path, json.dumps(data, indent=2) + \"\\n\", mode)\n"
}
</script>
<div id="tip" class="hidden rounded-lg bg-zinc-900 text-white text-[12px] leading-snug px-2.5 py-1.5 shadow-lg"></div>

<script>
// =====================================================================================
// Helpers
// =====================================================================================
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
const icons = () => { if (window.lucide) lucide.createIcons(); };

const KIND = {
  laptop:  { fill: "#f0f9ff", stroke: "#38bdf8", tag: "Laptop" },
  idp:     { fill: "#eef2ff", stroke: "#818cf8", tag: "Identity" },
  aws:     { fill: "#fff7ed", stroke: "#fb923c", tag: "AWS" },
  box:     { fill: "#f5f3ff", stroke: "#a78bfa", tag: "In the box" },
  control: { fill: "#fff1f2", stroke: "#fb7185", tag: "Control" },
  data:    { fill: "#ecfdf5", stroke: "#34d399", tag: "Storage" },
};

// =====================================================================================
// Drawer (click for detail) and tooltip (hover for a one-liner): shared by every screen
// =====================================================================================
let drawerKey = null;
function openDrawer(d){
  const el = document.querySelector("[data-drawer]");
  drawerKey = d.key || null;
  el.style.width = d.wide ? "min(920px, 100%)" : "";
  el.classList.remove("hidden");
  const block = (label, body, cls) => body ? `<div class="mt-4 rounded-lg ${cls} px-3.5 py-2.5"><div class="text-[11px] uppercase tracking-wide font-semibold mb-1">${label}</div><div class="text-[14px] leading-relaxed">${body}</div></div>` : "";
  el.innerHTML = `
    <div class="p-5">
      <div class="flex items-start justify-between gap-3">
        <div>
          <div class="text-[11px] uppercase tracking-wide font-semibold" style="color:${d.color || "#71717a"}">${esc(d.kicker || "")}</div>
          <h2 class="text-[21px] font-bold text-zinc-900 mt-0.5 leading-snug">${esc(d.title)}</h2>
        </div>
        <button data-drawer-close class="w-8 h-8 shrink-0 rounded-lg border border-zinc-300 grid place-items-center hover:bg-white" title="Close (Esc)"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      ${d.what ? `<p class="text-[15px] text-zinc-700 mt-3 leading-relaxed">${d.what}</p>` : ""}
      ${d.file ? `<button data-openfile="${d.file[0]}" data-stage="${d.file[1] || ""}" class="mt-3 px-3 py-1.5 rounded-lg border border-violet-200 bg-white text-violet-700 text-[13px] font-medium hover:bg-violet-50 flex items-center gap-1.5"><i data-lucide="file-code" class="w-3.5 h-3.5"></i>Show it in ${esc(FILES[d.file[0]].path)}</button>` : ""}
      ${d.html || ""}
      ${d.table ? `<div class="mt-4 rounded-lg border border-zinc-200 bg-white overflow-hidden"><table class="w-full text-[13.5px]"><tr class="bg-zinc-50 text-zinc-500 text-[11px] uppercase tracking-wide">${d.table.head.map(h => `<th class="text-left px-3 py-2">${h}</th>`).join("")}</tr>${d.table.rows.map(r => `<tr class="border-t border-zinc-100 align-top">${r.map((c, i) => `<td class="px-3 py-2 ${i === 0 ? "font-medium text-zinc-800" : "text-zinc-700"}">${c}</td>`).join("")}</tr>`).join("")}</table></div>` : ""}
      ${d.list ? `<${d.ordered ? "ol" : "ul"} class="mt-4 space-y-1.5">${d.list.map((t, i) => `<li class="flex gap-2 text-[14px] text-zinc-700 leading-relaxed">${d.ordered ? `<span class="w-5 h-5 shrink-0 rounded-full bg-zinc-800 text-white grid place-items-center text-[11px] font-bold mt-0.5">${i + 1}</span>` : `<i data-lucide="${d.check ? "check" : "chevron-right"}" class="w-4 h-4 shrink-0 mt-1 ${d.check ? "text-emerald-600" : "text-zinc-400"}"></i>`}<span>${t}</span></li>`).join("")}</${d.ordered ? "ol" : "ul"}>` : ""}
      ${d.after ? `<p class="text-[14px] text-zinc-600 mt-3 leading-relaxed">${d.after}</p>` : ""}
      ${d.rows ? `<div class="mt-4 rounded-lg bg-white border border-zinc-200 divide-y divide-zinc-100">${d.rows.map(([k, v]) => `<div class="px-3.5 py-2.5"><div class="text-[11px] uppercase tracking-wide font-semibold text-zinc-400 mb-0.5">${k}</div><div class="text-[14px] text-zinc-700 leading-relaxed">${v}</div></div>`).join("")}</div>` : ""}
      ${(d.notes || []).map(([label, body]) => block(label, body, "bg-amber-50 border border-amber-200 text-amber-900")).join("")}
      ${block("Why", d.why, "bg-white border border-zinc-200 text-zinc-700")}
      ${block(d.cantLabel || "What it can't do", d.cant, "bg-rose-50 border border-rose-100 text-rose-800")}
      ${block("What stops a developer changing it", d.stop, "bg-emerald-50 border border-emerald-100 text-emerald-900")}
      ${block("Fix", d.fix, "bg-amber-50 border border-amber-100 text-amber-900")}
      ${d.steps ? `<div class="mt-4"><div class="text-[11px] uppercase tracking-wide text-zinc-400 mb-1.5">${esc(d.stepsLabel || "Steps")}</div>
        <ol class="space-y-1.5">${d.steps.map((t, i) => `<li class="flex gap-2 text-[14px] text-zinc-700"><span class="w-5 h-5 shrink-0 rounded-full bg-zinc-800 text-white grid place-items-center text-[11px] font-bold">${i + 1}</span><span>${t}</span></li>`).join("")}</ol></div>` : ""}
      ${d.code ? `<div class="mt-4"><div class="text-[11px] uppercase tracking-wide text-zinc-400 mb-1.5">${esc(d.codeLabel || "From the code")}</div><pre class="code" ${d.codeWrap ? 'style="white-space:pre-wrap;word-break:break-all"' : ""}>${esc(d.code)}</pre></div>` : ""}
      ${d.source ? `<div class="mt-4 text-[12px] text-zinc-400">Source: ${d.source}</div>` : ""}
      ${d.foot ? `<div class="mt-5 pt-3 border-t border-zinc-200 text-[12px] text-zinc-400 leading-relaxed">${d.foot}</div>` : ""}
    </div>`;
  el.querySelector("[data-drawer-close]").addEventListener("click", closeDrawer);
  el.querySelectorAll("[data-openfile]").forEach(b => b.addEventListener("click", () => openFile(b.getAttribute("data-openfile"), b.getAttribute("data-stage"))));
  el.scrollTop = 0;
  icons();
}
function closeDrawer(){
  const el = document.querySelector("[data-drawer]");
  el.classList.add("hidden"); el.innerHTML = ""; drawerKey = null;
  if (screen === "overview") buildOverview();
}
const tipEl = document.getElementById("tip");
document.addEventListener("mouseover", e => {
  const t = e.target.closest("[data-tip]");
  if (!t){ tipEl.classList.add("hidden"); return; }
  tipEl.textContent = t.getAttribute("data-tip");
  tipEl.classList.remove("hidden");
});
document.addEventListener("mousemove", e => {
  if (tipEl.classList.contains("hidden")) return;
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 12;
  tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
});
document.addEventListener("mouseleave", () => tipEl.classList.add("hidden"));

function copyText(text, btn){
  const done = () => { if (btn){ const o = btn.innerHTML; btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i>`; icons(); setTimeout(() => { btn.innerHTML = o; icons(); }, 1200); } };
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (_) {} ta.remove(); done(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
// A command line with a copy button. The text is escaped; the button copies it verbatim.
const CMDS = [];
function cmd(text, dark = true){
  const i = CMDS.push(text) - 1;
  return `<div class="relative group"><pre class="${dark ? "code" : "rounded-lg bg-white border border-zinc-200 text-zinc-800 px-3 py-2 text-[12.5px] whitespace-pre-wrap break-words"} pr-10">${esc(text)}</pre>
    <button data-copy="${i}" class="absolute top-1.5 right-1.5 w-7 h-7 rounded-md ${dark ? "bg-white/10 text-zinc-300 hover:bg-white/20" : "bg-zinc-100 text-zinc-500 hover:bg-zinc-200"} grid place-items-center" title="Copy"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button></div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]");
  if (b){ e.stopPropagation(); copyText(CMDS[+b.getAttribute("data-copy")], b); }
});
const chip = (text, c) => `<span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-full bg-${c}-50 text-${c}-700 border border-${c}-200 whitespace-nowrap">${text}</span>`;
const SEEN = chip(`<i data-lucide="circle-check" class="w-3 h-3"></i>seen live`, "emerald");
const EXPECTED = chip(`<i data-lucide="circle-dashed" class="w-3 h-3"></i>expected, not yet seen live`, "amber");
const PENDING = chip(`<i data-lucide="circle-dashed" class="w-3 h-3"></i>not verified live yet`, "amber");

// =====================================================================================
// The file viewer: a source file in the drawer, with its stages
// =====================================================================================
// ---- Source files the pages open: embedded in this page (tools/embed_sources.py), shown in the drawer
const FILES = {
  dockerfile: { path: "box/Dockerfile",
    what: "The one file that builds every box's image, for linux/arm64 on ubuntu:24.04, in two stages.",
    stages: [["fetch", "fetch stage", /^# -+ fetch/], ["box", "box stage", /^# -+ the box/]] },
  managed: { path: "box/rootfs/etc/claude-code/managed-settings.json",
    what: "Claude Code's managed settings, at <code>/etc/claude-code/managed-settings.json</code> in the box: root-owned, from the image." },
  hook: { path: "box/rootfs/etc/claude-code/hooks/block-direct-access.py",
    what: "The org hook, at <code>/etc/claude-code/hooks/</code> in the box: runs before every Bash, Write and Edit." },
  config: { path: "box/rootfs/opt/devbox/lib/devbox/config.py",
    what: "The box's boot-time file maker. PID 1 (the supervisor, as root) calls these functions at every boot with the runtime's environment, which only an admin can change. Each checks its input and returns a file's contents; the supervisor writes the file, owned by root: <code>aws_config()</code> → <code>/etc/devbox/aws-config</code>, <code>tier_dropin()</code> → <code>managed-settings.d/20-tier.json</code> (the models), <code>managed_mcp()</code> → <code>managed-mcp.json</code> (web search), <code>sandbox_dropin()</code> → <code>managed-settings.d/30-sandbox.json</code>." },
};
const SOURCES = JSON.parse(document.getElementById("devbox-sources").textContent || "{}");
function fileText(key){   // the file's text, embedded in this page ("" if it isn't)
  return Promise.resolve(SOURCES[key] || "");
}
function paintLine(l, key){
  if (/^\s*#/.test(l)) return `<span class="cm">${esc(l)}</span>`;
  if (key === "dockerfile"){
    const m = l.match(/^(\s*)(FROM|RUN|COPY|ADD|ARG|ENV|WORKDIR|USER|CMD|ENTRYPOINT|LABEL|EXPOSE|SHELL|HEALTHCHECK|VOLUME)\b(.*)$/);
    if (m) return `${m[1]}<span class="kw">${m[2]}</span>${esc(m[3])}`;
  }
  if (key === "hook" || key === "config"){
    const m = l.match(/^(\s*)(def|return|import|for|if|elif|else|raise)\b(.*)$/);
    if (m) return `${m[1]}<span class="kw">${m[2]}</span>${esc(m[3])}`;
  }
  return esc(l);
}
async function openFile(key, stage){
  const f = FILES[key];
  openDrawer({ key: "file:" + key, wide: true, kicker: "Source file", color: "#7c3aed", title: f.path, what: f.what,
    html: `<div data-filebody class="mt-4 text-[13px] text-zinc-500">Loading ${esc(f.path)}…</div>` });
  const text = await fileText(key);
  const body = document.querySelector("[data-filebody]");
  if (!body || drawerKey !== "file:" + key) return;
  if (!text){ body.innerHTML = `${esc(f.path)} isn't embedded in this page: run <code>python3 tools/embed_sources.py</code>.`; return; }
  const lines = text.replace(/\n$/, "").split("\n");
  const starts = (f.stages || []).map(([id, label, re]) => [id, label, lines.findIndex(l => re.test(l))]).filter(s => s[2] >= 0);
  const ranges = Object.fromEntries(starts.map(([id, label, a], i) => [id, [a, i + 1 < starts.length ? starts[i + 1][2] - 1 : lines.length - 1]]));
  const paint = l => paintLine(l, key);
  const show = sel => {
    const [a, b] = ranges[sel] || [-1, -2];
    body.innerHTML = `
      <div class="flex flex-wrap items-center gap-2 mb-2">

}

const PRE_MODELS = { opus: "anthropic.claude-opus-5", sonnet: "anthropic.claude-sonnet-4-5-20250929-v1:0", haiku: "anthropic.claude-haiku-4-5-20251001-v1:0" };
function prePolicy(tier){
  const ms = tier === "Power" ? ["opus", "sonnet", "haiku"] : ["sonnet", "haiku"];
  const res = [...ms.map(m => `arn:aws:bedrock:*:*:inference-profile/us.${PRE_MODELS[m]}`), ...ms.map(m => `arn:aws:bedrock:*::foundation-model/${PRE_MODELS[m]}`)];
  return JSON.stringify({ Version: "2012-10-17", Statement: [
    { Sid: `Invoke${tier}Models`, Effect: "Allow", Action: ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream"], Resource: res },
    { Sid: "DiscoverProfiles", Effect: "Allow", Action: ["bedrock:ListInferenceProfiles", "bedrock:GetInferenceProfile"], Resource: "*" },
    { Sid: "SendClaudeCodeMetrics", Effect: "Allow", Action: "cloudwatch:PutMetricData", Resource: "*" },
    { Sid: "ReadOwnDirectoryRecordOnly", Effect: "Allow", Action: ["identitystore:GetUserId", "identitystore:DescribeUser"],
      Resource: ["arn:aws:identitystore::<management account>:identitystore/<identity store id>", "arn:aws:identitystore:::user/${identitystore:userId}"] },
  ] }, null, 2);
}

    code: prePolicy(tier), codeLabel: "The inline policy (IDENTITY-SETUP.md, part 3)",

}

function buildRuntime(){
  const el = document.querySelector('[data-pane="runtime"]');
  const scen = RT_SCENARIOS.map((s, i) => `
    <section class="rounded-2xl border border-zinc-200 bg-white overflow-hidden">
      <div class="px-5 pt-4 pb-3 flex flex-wrap items-center gap-2.5">
        <span class="w-8 h-8 rounded-full bg-zinc-900 text-white grid place-items-center text-[14px] font-bold">${i + 1}</span>
        <h2 class="text-[18px] font-bold text-zinc-900">${s.title}</h2>
        ${chip(esc(s.who), "sky")}${chip(`<i data-lucide="timer" class="w-3 h-3"></i>${esc(s.time)}`, "zinc")}
      </div>
      ${s.note ? `<p class="px-5 -mt-1 pb-3 text-[13.5px] text-zinc-500 leading-snug">${s.note}</p>` : ""}
      <table class="w-full text-[14px]">
        <tr class="bg-zinc-50 text-zinc-500 text-[11px] uppercase tracking-wide"><th class="text-left px-5 py-2 w-[46%]">Do</th><th class="text-left px-3 py-2">Expect</th></tr>
        ${s.steps.map(([d, e], j) => `<tr class="border-t border-zinc-100 align-top">
          <td class="px-5 py-2.5 text-zinc-800"><span class="text-zinc-400 font-semibold mr-1.5">${i + 1}.${j + 1}</span>${d}</td>
          <td class="px-5 py-2.5 text-zinc-700 leading-snug">${e}</td></tr>`).join("")}
      </table>
    </section>`).join("");
  el.innerHTML = `
  <div class="max-w-[1400px] mx-auto px-8 py-6">
    <h1 class="text-[28px] font-bold text-zinc-900 leading-tight">Using it</h1>
    <p class="text-[16px] text-zinc-500 mt-1 mb-5 leading-relaxed">Seven checks to run on a deployed box, step by step, each with what you should see.</p>
    <div class="space-y-5">${scen}</div>
    <section class="rounded-2xl border border-zinc-200 bg-white overflow-hidden mt-5">
      <div class="px-5 pt-4 pb-3 flex items-center gap-2.5"><i data-lucide="list-plus" class="w-5 h-5 text-zinc-500"></i><h2 class="text-[18px] font-bold text-zinc-900">More checks</h2>

      </table>
    </section>
  </div>`;
  icons();
}

// =====================================================================================
// Screens, nav, boot
// =====================================================================================
const SCREENS = [["prereqs", "list-checks", "Before you start"], ["overview", "plane", "30,000 ft view"], ["image", "package", "The box image"], ["configs", "file-cog", "The config files"], ["hooks", "shield-check", "The hooks"], ["locks", "lock", "Locking the files"], ["sdeploy", "rocket", "Deploying it"], ["runtime", "play", "Using it"]];
let screen = "prereqs";
function bindGoto(root){ root.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => setScreen(b.getAttribute("data-goto")))); }
function renderNav(){
  document.querySelector("[data-nav-list]").innerHTML = SCREENS.map(([id, icon, label]) => `
    <button data-nav="${id}" class="w-full text-left px-3 py-2 rounded-lg text-[13.5px] flex items-center gap-2.5 ${id === screen ? "bg-zinc-100 font-semibold text-zinc-900" : "text-zinc-600 hover:bg-zinc-50"}">
      <i data-lucide="${icon}" class="w-4 h-4 ${id === screen ? "text-zinc-700" : "text-zinc-400"}"></i>${label}</button>`).join("");
  document.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => { setMenu(false); setScreen(b.getAttribute("data-nav")); }));
}
const BUILDERS = { prereqs: buildPrereqs, overview: buildOverview, image: buildImage, configs: buildConfigs, hooks: buildHooks, locks: buildLocks, sdeploy: buildSimpleDeploy, runtime: buildRuntime };
function setScreen(s){
  if (!BUILDERS[s]) s = "prereqs";
  screen = s;
  if (drawerKey){ const el = document.querySelector("[data-drawer]"); el.classList.add("hidden"); el.innerHTML = ""; drawerKey = null; }
  SCREENS.forEach(([id]) => document.querySelector(`[data-pane="${id}"]`).classList.toggle("hidden", id !== s));
  document.querySelector("[data-screen-title]").textContent = SCREENS.find(x => x[0] === s)[2];
  BUILDERS[s]();
  renderNav();
  tipEl.classList.add("hidden");
  try { localStorage.setItem("serverexplainer.screen", s); } catch (_) {}
  icons();
}
function menuOpen(){ return !document.querySelector("[data-nav-bar]").classList.contains("hidden"); }
function setMenu(open){
  const nav = document.querySelector("[data-nav-bar]");
  nav.classList.toggle("hidden", !open); nav.classList.toggle("flex", open);
  document.querySelector("[data-menu-toggle]").setAttribute("aria-expanded", String(open));
}
document.querySelector("[data-menu-toggle]").addEventListener("click", e => { e.stopPropagation(); setMenu(!menuOpen()); });
document.addEventListener("click", e => { if (menuOpen() && !e.target.closest("[data-nav-bar]")) setMenu(false); });
document.addEventListener("keydown", e => {
  if (menuOpen() && e.key === "Escape"){ setMenu(false); return; }
  if (e.key === "Escape") closeDrawer();
});


let saved = "prereqs";
try { const s = localStorage.getItem("serverexplainer.screen"); if (s && BUILDERS[s]) saved = s; } catch (_) {}
if (location.hash && BUILDERS[location.hash.slice(1)]) saved = location.hash.slice(1);
screen = saved;
setScreen(screen);
</script>
