# Override for ./run.sh smoke: replaces the real box with the small test box from fake-agentcore/test,
# so the fakes and the Docker wiring can be checked without building devbox-box.
services:
  box:
    image: public.ecr.aws/docker/library/node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    build: !reset null
    env_file: !reset []
    user: node
    working_dir: /stub/test
    command: ["node", "stub-box-main.mjs"]
    volumes:
      - ./fake-agentcore:/stub:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ping"]
      interval: 2s
      retries: 30
