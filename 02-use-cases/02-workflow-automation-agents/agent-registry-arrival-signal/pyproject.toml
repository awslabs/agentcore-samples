[project]
name = "agent-registry-sample"
version = "0.1.0"
description = "AWS Agent Registry arrival-signal sample (U0: SDK reconciliation)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.116",
    "aws-cdk-lib>=2.274.0",
    "constructs>=10.0.0,<11.0.0",
    "strands-agents>=1.62.0",
    "bedrock-agentcore[a2a,strands-agents]>=1.18.1",
    "a2a-sdk[all]>=0.3.0,<0.4.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "checkov>=3.2.0",
    "detect-secrets>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_registry_sample"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "orchestrator-host",
    "peer-host",
    "cdk.out",
    "**/cdk.out",
    "**/node_modules",
    "**/.cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
