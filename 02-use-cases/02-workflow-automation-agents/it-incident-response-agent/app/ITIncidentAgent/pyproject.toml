[build-system]
# Build-isolation graph observed with the Python 3.12 image; separate from uv.lock's runtime graph.
requires = [
    "hatchling==1.33.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
]
build-backend = "hatchling.build"

[project]
name = "ITIncidentAgent"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-opentelemetry-distro[patch]>=0.24,<0.25",
    "bedrock-agentcore >= 1.0.3, < 2.0",
    "botocore[crt] >= 1.35.0, < 2.0",
    "mcp >= 1.19.0, < 2.0",
    "strands-agents >= 1.13.0, < 2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
