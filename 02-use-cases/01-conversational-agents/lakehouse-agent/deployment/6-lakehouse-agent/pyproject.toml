[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lakehouse-agent"
version = "0.1.0"
description = "Lakehouse claims agent (Strands) for AgentCore Runtime"
requires-python = ">=3.10"
# Packaged by the AgentCore CLI (CodeZip).
dependencies = [
    "aws-opentelemetry-distro==0.12.2",
    "bedrock-agentcore>=1.0.0",
    "strands-agents>=1.0.0",
    "boto3>=1.34.0",
    "mcp>=1.0.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
