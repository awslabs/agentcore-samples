[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensearch-mcp-server"
version = "0.1.0"
description = "Claim-notes OpenSearch MCP server for AgentCore Runtime"
requires-python = ">=3.10"
# Packaged by the AgentCore CLI (CodeZip). Only runtime dependencies are listed here;
# deploy-time tooling is not.
dependencies = [
    "aws-opentelemetry-distro==0.12.2",
    "bedrock-agentcore>=1.0.0",
    "boto3>=1.43.0",
    "mcp>=1.9.0,<2",
    "requests>=2.31.0",
    "opensearch-py>=2.4.0,<4",
    "aws-requests-auth>=0.4.3",
    "PyJWT>=2.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
