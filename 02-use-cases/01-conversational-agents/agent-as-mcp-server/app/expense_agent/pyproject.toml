[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expense_agent"
version = "0.1.0"
description = "Strands agent exposed as an MCP server on AgentCore Runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bedrock-agentcore >= 1.15.0, < 2.0",
    "mcp >= 1.24.0, < 2.0",
    "strands-agents >= 1.44.0, < 2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
