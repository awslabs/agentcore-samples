name: OpenAI payment tutorial tests

on:
  pull_request:
    branches: [main]
    paths:
      - "01-features/08-agents-that-transact/00-getting-started/01-agents-payments-and-limits/**"
      - "01-features/08-agents-that-transact/00-getting-started/02-deploy-to-agentcore-runtime/**"
      - ".github/workflows/openai-payments-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.10"
            agents: "openai-agents==0.19.1"
            agentcore: "bedrock-agentcore==1.18.0"
            httpx: "httpx==0.27.1"
          - python: "3.14"
            agents: "openai-agents>=0.19.1"
            agentcore: "bedrock-agentcore>=1.18.0"
            httpx: "httpx>=0.27.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install OpenAI tutorial and test dependencies
        run: |
          python -m pip install \
            "${{ matrix.agents }}" "${{ matrix.agentcore }}" "${{ matrix.httpx }}" \
            "aws-bedrock-token-generator>=1.1.0" "botocore[crt]>=1.43.5" \
            "python-dotenv>=1.0.0" pytest
      - name: Run offline payment regressions
        run: python -m pytest 01-features/08-agents-that-transact/00-getting-started/01-agents-payments-and-limits/tests/test_openai_payments.py -q
