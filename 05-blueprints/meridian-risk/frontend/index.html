<!doctype html>
<!-- data-theme is set by the inline script below, before first paint. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian Risk — KYC Onboarding Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Set the theme before first paint. React applies it too, but only after the
      bundle parses — without this the dark default flashes for a beat on light
      theme. Kept inline and dependency-free so it runs synchronously.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem("meridian.theme")
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
          document.documentElement.setAttribute("data-theme", theme)
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark")
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
